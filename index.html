<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>AI Chat</title>

        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <div class="container">
            <h1>AI Chat</h1>

           <div class="message ai">

    <strong>🤖 Hiruy AI</strong>

    <p>
        Welcome to Hiruy Recipe AI!
    </p>

    <p>
        I can help you with recipes, ingredients,
        cooking instructions, and Ethiopian dishes.
    </p>

    <p>
        You can ask questions in
        <strong>English</strong> or
        <strong>አማርኛ</strong>.
    </p>

    <p>
        Try asking:
    </p>

    <ul>
        <li>How do I make Doro Wot?</li>
        <li>ዶሮ ወጥ እንዴት እሰራለሁ?</li>
        <li>Suggest a vegetarian recipe.</li>
    </ul>

</div>

            <div class="input-area">
                <input type="text" id="prompt" placeholder="Ask something..." />

                <button id="sendBtn">Send</button>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
